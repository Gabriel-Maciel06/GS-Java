spring:
  application:
    name: alertacom-api
  profiles:
    active: dev
  jackson:
    serialization:
      write-dates-as-timestamps: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  api-docs:
    path: /v3/api-docs

jwt:
  secret: AlertaComSuperChaveSecretaGlobalSolutionFIAP2026
  expiration-hours: 24

api:
  security:
    token:
      secret: ${jwt.secret}

server:
  port: 8080
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus, env, beans
  endpoint:
    health:
      show-details: when-authorized
      roles: GESTOR
      probes:
        enabled: true
    info:
      enabled: true
  health:
    rabbit:
      enabled: false

info:
  app:
    name: "AlertaCom API"
    description: "Sistema Inteligente de Alerta e Gestão de Incidentes Urbanos (FIAP 2TDSR)"
    version: "1.0.0"
